version: '3.8'

services:
  odoo-kraken-consumer:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: odoo_kraken_consumer
    restart: unless-stopped
    # Define environment variables explicitly or load from a secure file
    env_file:
      - .env
    volumes:
      # Mount local 'data' folder for SQLite DB and logs persistence
      - ./data:/app/data
    
    # Industry standard logging limits to prevent disk space exhaustion
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Resource limits to prevent memory leaks from crashing the host node
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
